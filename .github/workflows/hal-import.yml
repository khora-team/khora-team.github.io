name: Update publications

on:
  schedule:
    - cron: "0 4 * * 1"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download publications from HAL
        run: |
          mkdir -p data

          wget \
            --output-document=data/publications.xml \
            "https://haltools.inria.fr/Public/exportPubli.php?annee_publideb=2026&annee_publifin=2026&labos_exp=diverse&format_export=xml&langue=Anglais"

          echo "Downloaded file:"
          file data/publications.xml

          echo "First lines:"
          head -n 10 data/publications.xml

          if ! grep -q '^@' data/publications.xml; then
            echo "ERROR: HAL did not return an XML document."
            exit 1
          fi

      - name: Generate publication pages
        run: npm run publications:import

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add data/publications.xml
          git add src/content/publications
          
          if git diff --cached --quiet; then
            echo "No publication changes detected."
          else
            git commit -m "chore(hal): publications updated"
            git push
          fi